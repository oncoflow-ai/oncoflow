[project]
name = "oncoflow-backend"
version = "0.1.0"
description = "Backend foundation for OncoFlow MRI ingestion and processing."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
